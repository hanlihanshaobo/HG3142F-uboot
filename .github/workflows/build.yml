name: Build U-Boot (bcm96855)

on:
  push:
    tags: ['uboot-v*']
  workflow_dispatch:
    inputs:
      uboot_ref:
        description: 'u-boot 版本/tag'
        required: false
        default: 'v2024.04'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      UBOOT_REF: ${{ inputs.uboot_ref || 'v2024.04' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git bison flex bc libssl-dev swig \
            gcc-arm-linux-gnueabihf device-tree-compiler u-boot-tools python3-pyelftools

      - name: Fetch U-Boot
        run: |
          git clone --depth 1 --branch "${UBOOT_REF}" https://github.com/u-boot/u-boot.git u-boot
          git -C u-boot log -1 --format='%H %s'

      - name: Apply board files
        run: sh scripts/apply-board.sh u-boot

      - name: Build
        run: |
          cd u-boot
          export CROSS_COMPILE=arm-linux-gnueabihf-
          make bcm96855_mb4784w_defconfig
          make -j$(nproc)
          ls -lh u-boot.bin u-boot.dtb

      - name: Package
        run: |
          mkdir -p out
          cp -v u-boot/u-boot.bin out/
          cp -v u-boot/u-boot.dtb out/
          cp -v u-boot/System.map out/
          cp -v u-boot/.config out/config-used
          cp -v board/mb4784w/uEnv.txt out/
          ( cd out && sha256sum * > SHA256SUMS )
          ls -lh out/
          echo "## U-Boot 构建结果 (${UBOOT_REF})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: uboot-bcm96855-mb4784w-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/uboot-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "U-Boot bcm96855 ${GITHUB_REF_NAME}" \
            --notes "主线 U-Boot (${UBOOT_REF}) + 板级文件构建产物。注意：这是 RAM 引导配置，不含 SPL/TPL，不能直接写入 mtd1 loader 分区。使用方式见 README 与 docs/TTL-RECOVERY.md。" \
            --prerelease
