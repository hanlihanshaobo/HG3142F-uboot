name: Build ARM tools

on:
  push:
    tags: ['tools-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Build
        run: |
          mkdir -p out
          for f in tools/*.c; do
            n=$(basename "$f" .c)
            arm-linux-gnueabihf-gcc -static -O2 -o "out/$n" "$f" || exit 1
            echo "built $n"
          done
          file out/* || true
          ( cd out && sha256sum * > SHA256SUMS; cat SHA256SUMS )

      - uses: actions/upload-artifact@v4
        with:
          name: arm-tools
          path: out/
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/tools-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* --repo "${GITHUB_REPOSITORY}" \
            --title "ARM tools ${GITHUB_REF_NAME}" \
            --notes "静态编译的 ARM32 小工具（基于 libfhdrv_kdrv_board.so 反编译结果）。" \
            --prerelease
